name: Unit Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: jdx/mise-action@v5
    - name: Install modules
      run: npm install
    - name: Run tests
      run: npm run test:unit
